    <path d="M 590 149 C 598 152, 606 152, 612 149 C 614 163, 614 177, 612 185 C 605 188, 597 188, 589 185 C 587 177, 588 163, 590 149 Z" fill="#05161A" stroke="#294D61" stroke-width="1.2"/>
