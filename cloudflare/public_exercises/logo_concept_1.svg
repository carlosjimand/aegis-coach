<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="c1b_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#7B88FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="c1b_coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="50%" stop-color="#FF5E80"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="c1b_core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FF5E80"/>
      <stop offset="100%" stop-color="#7B88FF"/>
    </linearGradient>
    <linearGradient id="c1b_wing" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF5E80"/>
    </linearGradient>
  </defs>

  <!-- Left Sculpted Shoulder & Flank (Aggressive Aero Wing) -->
  <path d="M 50 14
           C 38 12, 22 18, 16 32
           C 11 48, 16 68, 32 82
           C 40 88, 47 92, 50 93
           C 44 86, 28 76, 25 61
           C 22 47, 28 34, 40 26
           C 44 23, 48 18, 50 14
           Z" 
        fill="url(#c1b_blue)"/>

  <!-- Right Sculpted Shoulder & Flank (Kinetic Downforce Wing) -->
  <path d="M 50 14
           C 62 12, 78 18, 84 32
           C 89 48, 84 68, 68 82
           C 60 88, 53 92, 50 93
           C 56 86, 72 76, 75 61
           C 78 47, 72 34, 60 26
           C 56 23, 52 18, 50 14
           Z" 
        fill="url(#c1b_coral)"/>

  <!-- Propulsive 'A' Apex (Runner's Summit Vector) -->
  <path d="M 50 26
           C 52 26, 61 46, 65 62
           C 66 66, 62 68, 57 67
           C 54 62, 53 56, 50 56
           C 47 56, 46 62, 43 67
           C 38 68, 34 66, 35 62
           C 39 46, 48 26, 50 26
           Z" 
        fill="url(#c1b_core)"/>

  <!-- Aerodynamic Tape-Breaking Horizon Crossbar -->
  <path d="M 22 57
           C 35 53, 65 53, 78 57
           C 68 61, 32 61, 22 57
           Z" 
        fill="url(#c1b_wing)"/>
</svg>